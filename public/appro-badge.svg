<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img" aria-label="APPRO">
  <defs>
    <style>
      .ink   { fill: #C5504F; }
      .inkb  { stroke: #C5504F; fill: none; }
      .word  { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: 6px; }
      .sub   { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: 3.2px; }
    </style>
  </defs>

  <g transform="rotate(-4 210 100)" opacity="0.94">
    <!-- Double filet : les vrais tampons de caoutchouc ont deux cadres -->
    <rect class="inkb" x="42" y="42" width="336" height="116" rx="9" stroke-width="6"/>
    <rect class="inkb" x="54" y="54" width="312" height="92"  rx="4" stroke-width="1.75" opacity="0.65"/>

    <text class="word ink" x="210" y="112" font-size="52" text-anchor="middle">APPRO</text>
    <text class="sub  ink" x="210" y="136" font-size="11" text-anchor="middle" opacity="0.8">CONTENEURS EXPERTS</text>
  </g>
</svg>
