<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 92" width="300" height="92" role="img" aria-label="APPRO — Approbation des factures et dépenses">
  <defs>
    <style>
      .h-word { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: 5px; fill: #C5504F; }
      .h-tag  { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 500; letter-spacing: 0.5px; fill: #5B6570; }
    </style>
  </defs>

  <!-- Cadre du tampon, droit, centré horizontalement sur 300 -->
  <g opacity="0.95">
    <rect x="66" y="6" width="168" height="46" rx="6" fill="none" stroke="#C5504F" stroke-width="4"/>
    <rect x="74" y="14" width="152" height="30" rx="2" fill="none" stroke="#C5504F" stroke-width="1.2" opacity="0.6"/>
    <text class="h-word" x="152" y="38" font-size="27" text-anchor="middle">APPRO</text>
  </g>

  <text class="h-tag" x="150" y="76" font-size="12.5" text-anchor="middle">Approbation des factures et dépenses</text>
</svg>
